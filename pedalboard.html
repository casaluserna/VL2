<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VoiceLive 2 - Virtual Pedalboard Live</title>

<style>
  :root {
    --chassis: #17191d;
    --chassis-border: #2e333d;
    --lcd-bg: #031424;
    --lcd-text: #52c8ff;
    --lcd-dim: #1e587d;
    --led-off: #3a1c1c;
    --led-on: #00ff66;
    --led-glow: rgba(0, 255, 102, 0.6);
    --blue: #3d8bfd;
  }

  * { box-sizing: border-box; touch-action: manipulation; user-select: none; }
  
  body {
    margin: 0;
    padding: 14px;
    background: #0c0d10;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }

  .pedalboard-case {
    width: 100%;
    max-width: 820px;
    background: linear-gradient(180deg, #22262e 0%, var(--chassis) 100%);
    border: 3px solid var(--chassis-border);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.1);
  }

  /* TOP BAR */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    flex-wrap: wrap;
    gap: 10px;
  }

  a.nav-link {
    color: var(--blue);
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
  }

  .midi-selector-wrap {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  select.midi-select {
    background: #0e1013;
    border: 1px solid #3a404d;
    color: #cfd6e4;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 13px;
    max-width: 220px;
  }

  /* ICONICO DISPLAY LCD RETROILLUMINATO BLU TC-HELICON */
  .vl2-lcd {
    background: var(--lcd-bg);
    border: 3px solid #082949;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 22px;
    box-shadow: inset 0 0 20px rgba(3, 85, 155, 0.4), 0 4px 10px rgba(0,0,0,0.5);
    font-family: "Courier New", Courier, monospace;
  }

  .lcd-header {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--lcd-dim);
    letter-spacing: 1px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .lcd-main-line {
    display: flex;
    align-items: baseline;
    gap: 15px;
  }

  .lcd-preset-num {
    font-size: 42px;
    font-weight: 900;
    color: var(--lcd-text);
    text-shadow: 0 0 12px rgba(82, 200, 255, 0.7);
    line-height: 1;
  }

  .lcd-song-title {
    font-size: 22px;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 0 0 10px rgba(82, 200, 255, 0.5);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .lcd-footer {
    margin-top: 8px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--lcd-text);
    border-top: 1px solid #083057;
    padding-top: 6px;
  }

  /* SELETTORE RAPIDO SCALETTA */
  .setlist-quick-select {
    margin-bottom: 20px;
  }
  .setlist-quick-select select {
    width: 100%;
    padding: 12px;
    background: #111317;
    border: 1px solid #333a46;
    color: #fff;
    font-size: 16px;
    border-radius: 8px;
  }

  /* GRIGLIA PEDALI STOMPSWITCH */
  .stomp-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 14px;
  }

  @media (max-width: 650px) {
    .stomp-grid { grid-template-columns: repeat(2, 1fr); }
    .lcd-preset-num { font-size: 32px; }
    .lcd-song-title { font-size: 18px; }
  }

  /* SINGOLO PEDALE STOMP */
  .stomp-box {
    background: linear-gradient(180deg, #2b303b 0%, #1a1d24 100%);
    border: 2px solid #3d4554;
    border-radius: 14px;
    padding: 14px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    min-height: 125px;
    cursor: pointer;
    box-shadow: 0 5px 0 #101216, 0 8px 12px rgba(0,0,0,0.5);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .stomp-box:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #101216, 0 3px 6px rgba(0,0,0,0.6);
  }

  .stomp-name {
    font-weight: 800;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #e5e9f0;
    text-align: center;
  }

  .stomp-sub {
    font-size: 11px;
    color: #7e8799;
    margin-top: 2px;
  }

  /* PULSANTE CROMATO STOMP CENTRALE */
  .stomp-button {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: radial-gradient(circle, #e2e8f0 0%, #8a94a6 60%, #485162 100%);
    border: 3px solid #1c2028;
    box-shadow: 0 4px 6px rgba(0,0,0,0.6), inset 0 2px 3px rgba(255,255,255,0.8);
    margin: 8px 0;
  }

  /* LED LUMINOSO STOMP */
  .stomp-led {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--led-off);
    border: 1px solid #111;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
    transition: background 0.15s, box-shadow 0.15s;
  }

  .stomp-box.active .stomp-led {
    background: var(--led-on);
    box-shadow: 0 0 12px var(--led-glow), inset 0 0 3px #fff;
  }

  .stomp-box.active {
    border-color: #2e6945;
  }

  /* PEDALI DI NAVIGAZIONE CANZONI (PREV / NEXT) */
  .stomp-nav {
    background: linear-gradient(180deg, #1f2735 0%, #151b24 100%);
    border-color: #354a6b;
  }
  .stomp-nav .stomp-name { color: #8ec3ff; }
</style>
</head>
<body>

<div class="pedalboard-case">

  <!-- TOP BAR: RITORNO & CONNESSIONE MIDI -->
  <div class="top-bar">
    <div style="display:flex; gap:14px; align-items:center;">
      <a href="/" class="nav-link">← Menu Hub</a>
      <a href="setlist.html" class="nav-link">🎵 Scaletta & Testi</a>
    </div>
    <div class="midi-selector-wrap">
      <select id="midiOutputSelect" class="midi-select">
        <option value="">Ricerca MIDI...</option>
      </select>
      <span id="midiStatus" style="font-size:12px; font-weight:bold; color:#f44336;">OFFLINE</span>
    </div>
  </div>

  <!-- DISPLAY RETROILLUMINATO BLU TC-HELICON VOICELIVE 2 -->
  <div class="vl2-lcd">
    <div class="lcd-header">
      <span id="lcdPresetBank">TC-HELICON • VOICELIVE 2</span>
      <span id="lcdSongCounter">[ 0 / 0 ]</span>
    </div>
    <div class="lcd-main-line">
      <div class="lcd-preset-num" id="lcdPresetNum">P---</div>
      <div class="lcd-song-title" id="lcdSongTitle">Nessun Brano Selezionato</div>
    </div>
    <div class="lcd-footer">
      <span id="lcdMidiFeedback">CANALE 1 • CAVO USB / BLE</span>
      <span id="lcdNextSong">PROSSIMA: --</span>
    </div>
  </div>

  <!-- SCELTA RAPIDA DALLA SCALETTA ATTIVA -->
  <div class="setlist-quick-select">
    <select id="songSelectDropdown" onchange="selectSongByIndex(this.value)">
      <option value="">-- Seleziona Brano dalla Scaletta --</option>
    </select>
  </div>

  <!-- RIGA 1 EFFETTI: HARMONY, DOUBLE, REVERB, DELAY -->
  <div class="stomp-grid">
    <div class="stomp-box" id="stomp-110" onclick="toggleEffect(110)">
      <div class="stomp-name">Harmony</div>
      <div class="stomp-sub">CC 110</div>
      <div class="stomp-button"></div>
      <div class="stomp-led"></div>
    </div>

    <div class="stomp-box" id="stomp-111" onclick="toggleEffect(111)">
      <div class="stomp-name">Double</div>
      <div class="stomp-sub">CC 111</div>
      <div class="stomp-button"></div>
      <div class="stomp-led"></div>
    </div>

    <div class="stomp-box" id="stomp-112" onclick="toggleEffect(112)">
      <div class="stomp-name">Reverb</div>
      <div class="stomp-sub">CC 112</div>
      <div class="stomp-button"></div>
      <div class="stomp-led"></div>
    </div>

    <div class="stomp-box" id="stomp-117" onclick="toggleEffect(117)">
      <div class="stomp-name">Delay</div>
      <div class="stomp-sub">CC 117</div>
      <div class="stomp-button"></div>
      <div class="stomp-led"></div>
    </div>
  </div>

  <!-- RIGA 2: µMOD, TRANSDUCER, HARDTUNE + PEDALI CAMBIO BRANO -->
  <div class="stomp-grid">
    <div class="stomp-box" id="stomp-116" onclick="toggleEffect(116)">
      <div class="stomp-name">µMod</div>
      <div class="stomp-sub">CC 116</div>
      <div class="stomp-button"></div>
      <div class="stomp-led"></div>
    </div>

    <div class="stomp-box" id="stomp-118" onclick="toggleEffect(118)">
      <div class="stomp-name">Transducer</div>
      <div class="stomp-sub">CC 118</div>
      <div class="stomp-button"></div>
      <div class="stomp-led"></div>
    </div>

    <!-- PEDALE PRECEDENTE -->
    <div class="stomp-box stomp-nav" onclick="prevSong()">
      <div class="stomp-name">◀ PREV</div>
      <div class="stomp-sub">Canzone Prec.</div>
      <div class="stomp-button"></div>
      <div style="height:14px;"></div>
    </div>

    <!-- PEDALE SUCCESSIVO -->
    <div class="stomp-box stomp-nav" onclick="nextSong()">
      <div class="stomp-name">NEXT ▶</div>
      <div class="stomp-sub">Canzone Succ.</div>
      <div class="stomp-button"></div>
      <div style="height:14px;"></div>
    </div>
  </div>

</div>

<!-- MODULI MIDI CONDIVISI -->
<script src="midi-core.js"></script>
<script src="midi-manager.js"></script>

<script>
  let songs = [];
  let currentSongIndex = -1;

  // Mappatura stato Effetti CC (false = Spento, true = Acceso)
  const fxState = {
    110: false, // Harmony
    111: false, // Double
    112: false, // Reverb
    113: false, // HardTune
    116: false, // µMod
    117: false, // Delay
    118: false  // Transducer
  };

  // AVVIO
  window.addEventListener("load", async () => {
    // 1. Inizializza MIDI per Cavo USB e SK-7
    await MidiManager.init("midiOutputSelect", "midiStatus");

    // 2. Carica la scaletta condivisa salvata da setlist.html
    loadSetlist();
  });

  // CARICAMENTO SCALETTA DA LOCALSTORAGE
  function loadSetlist() {
    const saved = localStorage.getItem("voicelive_setlist");
    const dropdown = document.getElementById("songSelectDropdown");

    if (saved) {
      try {
        songs = JSON.parse(saved);
      } catch (e) {
        songs = [];
      }
    }

    dropdown.innerHTML = '<option value="">-- Seleziona Brano dalla Scaletta --</option>';

    if (songs && songs.length > 0) {
      songs.forEach((song, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = `${idx + 1}. ${song.title} (Preset ${song.preset})`;
        dropdown.appendChild(opt);
      });

      // Seleziona il primo brano all'avvio
      selectSongByIndex(0);
    } else {
      document.getElementById("lcdSongTitle").textContent = "Nessuna scaletta salvata";
      document.getElementById("lcdPresetNum").textContent = "P---";
    }
  }

  // SELEZIONE BRANO E CAMBIO PRESET SUL VL2
  function selectSongByIndex(index) {
    if (index === "" || index < 0 || index >= songs.length) return;

    currentSongIndex = parseInt(index, 10);
    const song = songs[currentSongIndex];

    // 1. Invia il Program Change al VoiceLive 2 (Preset - 1)
    const presetNumber = parseInt(song.preset, 10);
    MidiManager.sendProgramChange(presetNumber - 1);

    // 2. Aggiorna il Display LCD VL2
    document.getElementById("lcdPresetNum").textContent = `P${String(presetNumber).padStart(3, '0')}`;
    document.getElementById("lcdSongTitle").textContent = song.title;
    document.getElementById("lcdSongCounter").textContent = `[ ${currentSongIndex + 1} / ${songs.length} ]`;

    const nextSong = songs[currentSongIndex + 1];
    document.getElementById("lcdNextSong").textContent = nextSong 
      ? `PROSSIMA: ${nextSong.title.substring(0, 18)}...` 
      : "FINE SCALETTA";

    document.getElementById("songSelectDropdown").value = currentSongIndex;
  }

  // CAMBIO BRANO VIA PEDALI STOMP PREV / NEXT
  function prevSong() {
    if (songs.length === 0) return;
    let newIdx = currentSongIndex - 1;
    if (newIdx < 0) newIdx = songs.length - 1;
    selectSongByIndex(newIdx);
  }

  function nextSong() {
    if (songs.length === 0) return;
    let newIdx = currentSongIndex + 1;
    if (newIdx >= songs.length) newIdx = 0;
    selectSongByIndex(newIdx);
  }

  // CONTROLLO EFFETTI CC IN TEMPO REALE
  async function toggleEffect(cc) {
    const newState = !fxState[cc];
    const val = newState ? 127 : 0;

    // 1. Invio comando via cavo USB (MidiManager)
    if (MidiManager.activeOutput) {
      MidiManager.sendControlChange(cc, val);
    }

    // 2. Fallback via Bluetooth SK-7 (se attivo)
    if (typeof midiCharacteristic !== 'undefined' && midiCharacteristic) {
      try {
        const packet = new Uint8Array([0x80, 0x80, 0xB0 | MidiManager.midiChannel, cc, val]);
        await midiCharacteristic.writeValue(packet);
      } catch (e) {}
    }

    // Aggiorna stato e grafica dello Stomp Switch
    fxState[cc] = newState;
    const stompEl = document.getElementById("stomp-" + cc);
    if (stompEl) {
      stompEl.classList.toggle("active", newState);
    }
  }
</script>

</body>
</html>
